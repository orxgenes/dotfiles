# ─────────────────────────────────────────────
# Hyprland entrypoint
# ─────────────────────────────────────────────

source = ~/.config/hypr/environment.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/keybinds.conf

exec-once = qs

# ── Applications ─────────────────────────────

$terminal = kitty
$launcher = wofi --show drun
$fileManager = thunar

# ── Autostart ────────────────────────────────

# Quickshell will be enabled after its initial
# configuration has been validated.
# exec-once = qs

# ── General ──────────────────────────────────

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
    allow_tearing = false
}

# ── Decoration ───────────────────────────────

decoration {
    rounding = 6

    blur {
        enabled = true
        size = 3
        passes = 2
    }
}

# ── Animations ───────────────────────────────

animations {
    enabled = true

    bezier = default, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, default
    animation = windowsIn, 1, 4, default, popin
    animation = windowsOut, 1, 4, default, popin
    animation = border, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

# ── Input ────────────────────────────────────

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# ── Layouts ──────────────────────────────────

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# ── Misc ─────────────────────────────────────

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
}

# ── Gestures ─────────────────────────────────

gestures {
    workspace_swipe = false
}